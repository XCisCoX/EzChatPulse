<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0e1a" />
    <title>ChatPulse</title>
  </head>
  <body>
    <div id="app">
      <!-- Login / register -->
      <div id="login-view" class="view hidden"></div>

      <!-- Main app -->
      <div id="main-view" class="view hidden">
        <aside id="sidebar">
          <header id="sidebar-header">
            <input
              id="sidebar-search"
              type="text"
              placeholder="Search chats or users…"
              maxlength="32"
              autocomplete="off"
              spellcheck="false"
            />
          </header>
          <div id="chat-list"></div>
          <footer id="sidebar-footer">
            <div id="me-chip"></div>
          </footer>
          <!-- floating action button + menu: hover above the profile (chat list area) -->
          <button id="btn-new" class="fab-btn" title="New chat or group">＋</button>
          <div id="new-menu" class="hidden">
            <button id="mi-new-chat" class="action-btn">✎ New chat</button>
            <button id="mi-new-group" class="action-btn">＋ New group</button>
          </div>
        </aside>
        <section id="chat-pane">
          <header id="chat-header"></header>
          <div id="messages"></div>
          <div id="typing-bar" class="hidden"></div>
          <footer id="composer"></footer>
        </section>

        <!-- Empty state lives inside #main-view so it fills the pane area
             instead of squeezing the sidebar (flex sibling layout bug). -->
        <div id="empty-state" class="hidden">
          <div class="empty-logo">◉</div>
          <h1>ChatPulse</h1>
          <p>Pick a chat or start a new conversation</p>
        </div>
      </div>

      <div id="modal-root"></div>
      <div id="lightbox" class="hidden"></div>
      <div id="toast-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
